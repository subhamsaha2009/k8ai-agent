[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "k8ai-agent"
version = "0.1.0"
description = "AI-powered Kubernetes cluster management agent with AKS support"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Subham Saha"}
]
keywords = ["kubernetes", "k8s", "ai", "agent", "aks", "azure", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Systems Administration",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "openai>=1.0",
    "anthropic>=0.20",
    "kubernetes>=28.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "keyring>=25.0",
    "pyyaml>=6.0",
    "mcp>=1.0",
]

[project.scripts]
k8ai = "k8ai.cli:main"
k8ai-mcp = "k8ai.mcp_server:main"

[project.urls]
Homepage = "https://github.com/subhamsaha/k8ai-agent"
Repository = "https://github.com/subhamsaha/k8ai-agent"

[tool.setuptools.packages.find]
include = ["k8ai*"]
